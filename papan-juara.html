<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Papan Juara Engklek</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Press Start 2P', cursive; }
        body { 
            background-image: linear-gradient(rgba(44, 62, 80, 0.4), rgba(44, 62, 80, 0.4)), url('background.jpg');
            background-size: cover; background-color: #2c3e50; color: white; min-height: 100vh; 
            display: flex; justify-content: center; align-items: center; padding: 20px; 
        }
        .box { width: 100%; max-width: 650px; background: rgba(155, 89, 182, 0.95); padding: 40px 30px; border: 5px solid #fff; border-radius: 10px; text-align: center; box-shadow: 0px 10px 0px #000; }
        .tabel-skor { width: 100%; margin: 25px 0; border-collapse: collapse; font-size: 0.6rem; }
        .tabel-skor th, .tabel-skor td { padding: 15px; border: 3px solid #fff; text-align: center; }
        .tabel-skor th { background-color: #2c3e50; color: #f1c40f; }
        .tabel-skor td { background-color: rgba(0,0,0,0.2); }
        button { background: #e74c3c; color: white; padding: 15px 25px; font-size: 0.65rem; border: 4px solid #c0392b; cursor: pointer; box-shadow: 4px 4px 0px #000;}
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #f1c40f; text-shadow: 2px 2px 0px #000;">🏆 PAPAN SKOR JUARA</h2>
        <p style="font-size:0.5rem; color:#eccc68; margin-top:10px;">Nama pendaftar otomatis masuk ke baris peringkat teratas!</p>
        
        <table class="tabel-skor">
            <thead>
                <tr>
                    <th>PERINGKAT</th>
                    <th>NAMA PEMAIN</th>
                    <th>SKOR UTAMA</th>
                </tr>
            </thead>
            <tbody>
                <tr style="color: #f1c40f;">
                    <td>🥇 1</td>
                    <td id="namaUserAktif">MEMUAT...</td>
                    <td id="skorUserAktif">0 PTS</td>
                </tr>
                <tr>
                    <td>🥈 2</td>
                    <td>ANDI UNISA</td>
                    <td>80 PTS</td>
                </tr>
                <tr>
                    <td>🥉 3</td>
                    <td>BUDI KAMPUS</td>
                    <td>50 PTS</td>
                </tr>
            </tbody>
        </table>

        <button onclick="window.location.href='materi.html'">↩️ KEMBALI KE PETA</button>
    </div>

    <script>
        // Membaca data pendaftaran yang tersimpan di memori browser
        window.addEventListener('DOMContentLoaded', function() {
            let namaTerdaftar = localStorage.getItem('namaPemainAktif');
            let skorTerdaftar = localStorage.getItem('skorPemainAktif');

            // Jika ada user mendaftar, langsung cetak namanya di tabel peringkat 1
            if (namaTerdaftar) {
                document.getElementById('namaUserAktif').innerText = namaTerdaftar;
                document.getElementById('skorUserAktif').innerText = skorTerdaftar + " PTS";
            } else {
                document.getElementById('namaUserAktif').innerText = "BELUM DAFTAR";
                document.getElementById('skorUserAktif').innerText = "0 PTS";
            }
        });
    </script>
</body>
</html>
