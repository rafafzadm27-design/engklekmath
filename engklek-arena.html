<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Engklek Arena Kartun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Press Start 2P', cursive; }
        body { background: #2c3e50; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .halaman-game { width: 100%; max-width: 850px; background: rgba(24, 44, 97, 0.95); padding: 35px; border: 6px solid #2ecc71; border-radius: 15px; text-align: center; }
        .lintasan-engklek { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin: 80px 0 40px 0; padding: 15px; background: rgba(0, 0, 0, 0.4); border-radius: 8px; border: 3px dashed #718093; }
        .kotak-angka { position: relative; width: 75px; height: 75px; color: #fff; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 4px solid #000; box-shadow: 4px 4px 0px #000; transition: all 0.2s ease; }
        .negatif { background-color: #ff5252; } .nol { background-color: #f1c40f; color: #000; } .positif { background-color: #34ace0; }
        .kotak-angka::before { content: ""; position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%) scale(0); width: 60px; height: 60px; background-image: url('https://img.icons8.com/retro/100/super-mario.png'); background-size: contain; background-repeat: no-repeat; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .kotak-angka.aktif::before { transform: translateX(-50%) scale(1); animation: animasiGoyang 0.6s infinite alternate; }
        .kotak-angka.aktif { border-color: #fff; box-shadow: 0px 0px 15px #33d9b2; }
        @keyframes animasiGoyang { 0% { bottom: 85px; } 100% { bottom: 95px; } }
        .tombol-aksi { display: flex; justify-content: center; gap: 25px; margin-top: 30px; }
        .btn-lompat { background-color: #ffda79; color: #2c3e50; padding: 15px 25px; font-size: 0.7rem; border: 4px solid #ccae62; box-shadow: 4px 4px 0px #000; cursor: pointer; }
        .btn-kembali { background-color: #ff5252; border-color: #b33939; color: white; }
    </style>
</head>
<body>
    <div class="halaman-game">
        <h2 style="color: #2ecc71;">🏃 ARENA LOMPAT KARTUN</h2>
        <h3 style="font-size:0.7rem; margin: 20px 0;">POSISI KARTUN: <span id="txtPosisi" style="color:#33d9b2;">0</span></h3>
        <div class="lintasan-engklek">
            <div class="kotak-angka negatif" id="petak--3">-3</div>
            <div class="kotak-angka negatif" id="petak--2">-2</div>
            <div class="kotak-angka negatif" id="petak--1">-1</div>
            <div class="kotak-angka nol aktif" id="petak-0">0</div>
            <div class="kotak-angka positif" id="petak-1">1</div>
            <div class="kotak-angka positif" id="petak-2">2</div>
            <div class="kotak-angka positif" id="petak-3">3</div>
        </div>
        <div class="tombol-aksi">
            <button class="btn-lompat" onclick="lompatKiri()">⬅️ MUNDUR</button>
            <button class="btn-lompat" onclick="lompatKanan()">MAJU ➡️</button>
        </div>
        <div class="tombol-aksi"><button class="btn-lompat btn-kembali" onclick="window.location.href='materi.html'">↩️ KEMBALI KE PETA</button></div>
    </div>
    <script>
        let posisiMateri = 0;
        function lompatKanan() { if (posisiMateri < 3) { document.getElementById('petak-' + posisiMateri).classList.remove('aktif'); posisiMateri += 1; document.getElementById('petak-' + posisiMateri).classList.add('aktif'); document.getElementById('txtPosisi').innerText = posisiMateri; } }
        function lompatKiri() { if (posisiMateri > -3) { document.getElementById('petak-' + posisiMateri).classList.remove('aktif'); posisiMateri -= 1; document.getElementById('petak-' + posisiMateri).classList.add('aktif'); document.getElementById('txtPosisi').innerText = posisiMateri; } }
    </script>
</body>
</html>
